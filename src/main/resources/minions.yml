# ==========================================================
# EcoCore - Konfigurasi Minion
# Semua nilai di sini bisa diubah tanpa perlu update plugin.
# Material yang tidak dikenal akan dilewati dengan warning di
# console, bukan bikin server crash (Revisi 12/20/21).
# ==========================================================

global:
  max-level: 50
  # Revisi 11: jumlah maksimal storage page (54 slot per page) yang
  # bisa di-upgrade untuk satu minion.
  max-storage-pages: 10
  max-minions-per-player: 20
  base-radius: 6
  radius-per-upgrade: 2
  max-radius-upgrades: 5
  base-speed-ticks: 20
  speed-reduction-per-upgrade-ticks: 2
  min-speed-ticks: 4
  base-energy: 1000
  # Bug-fix round: STORAGE type alone uses max-storage-pages (above).
  # Every other minion type instead starts with this many usable
  # slots within its single 54-slot page, upgraded via
  # upgrades.active-slots-per-upgrade below.
  base-active-slot-count: 9
  energy-drain-per-action: 1
  fuel-types: [ "COAL", "COAL_BLOCK", "LAVA_BUCKET" ]
  auto-repair-enabled: true

# ================================================================
# Revisi 2: mode kerja per tipe minion.
# FACING_ONLY  = kerja lurus ke arah minion menghadap (kayak piston)
# ARENA_ONLY   = kerja di radius 360 derajat sekitar minion
# BOTH         = bisa dua-duanya, player bisa toggle di menu upgrade
# NONE         = minion gak kerja di dunia (storage/proses aja)
# ================================================================
work-mode:
  miner: BOTH
  quarry: BOTH
  lumberjack: BOTH
  farmer: BOTH
  collector: BOTH
  fisherman: ARENA_ONLY
  mob_killer: ARENA_ONLY
  smelter: NONE
  sell: NONE
  chest: NONE

# ================================================================
# Revisi 3: jarak tanam biar pohon/tanaman bisa tumbuh dengan baik.
# ================================================================
farming:
  spacing:
    enabled: true
    default-tree-spacing: 2
    default-canopy-clearance: 2
    crop-spacing: 1
    per-tree:
      OAK: { spacing: 2, canopy-clearance: 2 }
      SPRUCE: { spacing: 2, canopy-clearance: 2 }
      BIRCH: { spacing: 2, canopy-clearance: 2 }
      JUNGLE: { spacing: 2, canopy-clearance: 2 }
      ACACIA: { spacing: 3, canopy-clearance: 2 }
      DARK_OAK: { spacing: 2, canopy-clearance: 2, require-2x2: true }
      MANGROVE: { spacing: 3, canopy-clearance: 3 }
      CHERRY: { spacing: 3, canopy-clearance: 2 }

# ================================================================
# Revisi 12: daftar block yang bisa dihancurkan/diambil per tipe
# minion. Tambah/hapus material di sini langsung berlaku tanpa
# perlu ubah kode - misalnya tambah BEDROCK di targets.miner bikin
# Miner bisa nambang bedrock.
# ================================================================
targets:
  miner:
    - STONE
    - DEEPSLATE
    - COBBLESTONE
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - RAW_IRON_BLOCK
    - RAW_GOLD_BLOCK
    - RAW_COPPER_BLOCK
  quarry:
    - STONE
    - DEEPSLATE
    - COBBLESTONE
    - ANDESITE
    - DIORITE
    - GRANITE
    - TUFF
    - DIRT
    - GRAVEL
    - SAND
  farmer:
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - NETHER_WART
    - PUMPKIN
    - MELON
    - COCOA
  lumberjack:
    - OAK_LOG
    - SPRUCE_LOG
    - BIRCH_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG
    - CHERRY_LOG
    - CRIMSON_STEM
    - WARPED_STEM
  mob_killer:
    entities:
      - ZOMBIE
      - SKELETON
      - SPIDER
      - CREEPER
      - ENDERMAN

# ================================================================
# Revisi 5: recipe smelter, format input -> output.
# ================================================================
smelter:
  recipes:
    RAW_IRON: IRON_INGOT
    RAW_GOLD: GOLD_INGOT
    RAW_COPPER: COPPER_INGOT
    IRON_ORE: IRON_INGOT
    GOLD_ORE: GOLD_INGOT
    COPPER_ORE: COPPER_INGOT
    SAND: GLASS
    COBBLESTONE: STONE
    NETHERRACK: NETHER_BRICK
    CLAY_BALL: BRICK

# ================================================================
# Revisi 7: data per jenis pohon buat lumberjack - log, daun,
# sapling, chance drop apple/stick.
# ================================================================
lumberjack:
  # Revisi 22: chance minion tebang daun jadi sapling replant stock.
  sapling-harvest-chance: 0.15
  tree-species:
    OAK:
      log: OAK_LOG
      leaves: OAK_LEAVES
      sapling: OAK_SAPLING
      apple-chance: 0.005
      stick-chance: 0.02
    SPRUCE:
      log: SPRUCE_LOG
      leaves: SPRUCE_LEAVES
      sapling: SPRUCE_SAPLING
      apple-chance: 0.0
      stick-chance: 0.02
    BIRCH:
      log: BIRCH_LOG
      leaves: BIRCH_LEAVES
      sapling: BIRCH_SAPLING
      apple-chance: 0.0
      stick-chance: 0.02
    JUNGLE:
      log: JUNGLE_LOG
      leaves: JUNGLE_LEAVES
      sapling: JUNGLE_SAPLING
      apple-chance: 0.0
      stick-chance: 0.02
    ACACIA:
      log: ACACIA_LOG
      leaves: ACACIA_LEAVES
      sapling: ACACIA_SAPLING
      apple-chance: 0.0
      stick-chance: 0.02
    DARK_OAK:
      log: DARK_OAK_LOG
      leaves: DARK_OAK_LEAVES
      sapling: DARK_OAK_SAPLING
      apple-chance: 0.005
      stick-chance: 0.02
      require-2x2: true
    MANGROVE:
      log: MANGROVE_LOG
      leaves: MANGROVE_LEAVES
      sapling: MANGROVE_PROPAGULE
      apple-chance: 0.0
      stick-chance: 0.02
    CHERRY:
      log: CHERRY_LOG
      leaves: CHERRY_LEAVES
      sapling: CHERRY_SAPLING
      apple-chance: 0.0
      stick-chance: 0.02

# ================================================================
# Revisi 8: rarity tier hasil mancing fisherman. Weight relatif,
# gak perlu total 100.
# ================================================================
fisherman:
  rarity:
    COMMON:
      weight: 70
      pool: [ COD, SALMON ]
    UNCOMMON:
      weight: 20
      pool: [ TROPICAL_FISH, PUFFERFISH ]
    RARE:
      weight: 8
      pool: [ NAUTILUS_SHELL ]
    EPIC:
      weight: 1.8
      pool: [ HEART_OF_THE_SEA ]
    LEGENDARY:
      weight: 0.2
      pool: [ DIAMOND, EMERALD ]

# ================================================================
# Revisi 9: Connector Network - direct connection fixed 10 block
# (lihat MinionConnectorManager.DIRECT_MAX_DISTANCE di kode, bukan
# di sini karena memang gak bisa di-upgrade/diubah). Range di bawah
# ini khusus buat MinionConnectorEntity (relay).
# ================================================================
connector:
  base-range: 20.0
  range-per-upgrade: 15.0
  max-range-upgrades: 10
  upgrade-base-cost: 750.0
  upgrade-cost-growth: 1.4

# ================================================================
# Biaya dasar & pertumbuhan biaya upgrade minion (Revisi 20/22).
# ================================================================
upgrades:
  storage-page-base-cost: 500.0
  # Bug-fix round: non-STORAGE minions upgrade slot count instead of
  # page count - these three keys control that.
  max-active-slot-count: 54
  active-slots-per-upgrade: 9
  storage-slot-base-cost: 150.0
  radius-base-cost: 400.0
  speed-base-cost: 500.0
  cost-growth-per-level: 1.35

# ================================================================
