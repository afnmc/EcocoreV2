purchase:
  prices:
    miner: 500.0
    quarry: 700.0
    lumberjack: 450.0
    farmer: 400.0
    fisherman: 400.0
    collector: 350.0
    mob_killer: 600.0
    smelter: 500.0
    sell: 550.0
    chest: 200.0
    storage: 350.0

ai:
  # Sudah gak dipakai lagi untuk pathfinding - minion sekarang selalu
  # diam di tempat dan kerja instan dalam radius-nya, gak ada lagi
  # jalan/garis pandang. Dibiarin di sini biar gak error kalau ada
  # tooling lama yang baca ini.
  obstacle-avoidance-enabled: true
  target-selection-strategy: "NEAREST_HIGHEST_VALUE"
  pathfinding-max-nodes: 200
  pathfinding-recalculate-ticks: 40
