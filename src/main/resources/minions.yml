# ==========================================================
# EcoCore - Minions Configuration
# ==========================================================
global:
  max-level: 50
  base-storage-slots: 9
  storage-slots-per-upgrade: 9
  max-storage-upgrades: 6
  base-radius: 6
  radius-per-upgrade: 2
  max-radius-upgrades: 5
  base-speed-ticks: 20
  speed-reduction-per-upgrade-ticks: 2
  min-speed-ticks: 4
  base-energy: 1000
  energy-drain-per-action: 1
  fuel-types: [ "COAL", "COAL_BLOCK", "LAVA_BUCKET" ]
  auto-repair-enabled: true
  auto-sell-enabled: true
  auto-smelt-enabled: true

minions:
  miner:
    display-name: "&7Miner Minion"
    icon: "IRON_PICKAXE"
    base-efficiency: 1.0
  lumberjack:
    display-name: "&6Lumberjack Minion"
    icon: "IRON_AXE"
    base-efficiency: 1.0
  farmer:
    display-name: "&2Farmer Minion"
    icon: "IRON_HOE"
    base-efficiency: 1.0
  fishing:
    display-name: "&bFishing Minion"
    icon: "FISHING_ROD"
    base-efficiency: 0.8
  collector:
    display-name: "&fCollector Minion"
    icon: "HOPPER"
    base-efficiency: 1.2
  mob_killer:
    display-name: "&cMob Killer Minion"
    icon: "IRON_SWORD"
    base-efficiency: 0.9
  animal_farmer:
    display-name: "&eAnimal Farmer Minion"
    icon: "WHEAT"
    base-efficiency: 1.0
  smelter:
    display-name: "&7Smelter Minion"
    icon: "FURNACE"
    base-efficiency: 1.0
  storage:
    display-name: "&8Storage Minion"
    icon: "CHEST"
    base-efficiency: 1.0
  seller:
    display-name: "&aSeller Minion"
    icon: "EMERALD"
    base-efficiency: 1.0
  breeder:
    display-name: "&6Breeder Minion"
    icon: "EGG"
    base-efficiency: 0.7
  quarry:
    display-name: "&7Quarry Minion"
    icon: "DIAMOND_PICKAXE"
    base-efficiency: 1.3
  minion_chest:
    display-name: "&6Minion Chest"
    icon: "BARREL"
    base-efficiency: 1.0

purchase:
  prices:
    miner: 500.0
    lumberjack: 450.0
    farmer: 400.0
    fishing: 400.0
    collector: 350.0
    mob_killer: 600.0
    animal_farmer: 450.0
    smelter: 500.0
    storage: 300.0
    seller: 550.0
    breeder: 550.0
    quarry: 700.0
    minion_chest: 200.0

ai:
  # Sudah gak dipakai lagi - minion sekarang selalu diam di tempat dan
  # kerja instan dalam radius-nya, gak ada lagi jalan/garis pandang.
  # Dibiarin di sini biar gak error kalau ada tooling lama yang baca ini.
  obstacle-avoidance-enabled: true
  target-selection-strategy: "NEAREST_HIGHEST_VALUE"
  pathfinding-max-nodes: 200
  pathfinding-recalculate-ticks: 40
