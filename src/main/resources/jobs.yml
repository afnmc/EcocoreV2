anti-abuse:
  action-cooldown-seconds: 0.5
  daily-action-cap-per-mission: 5000

# ================================================================
# Revisi 18: pool misi per job. Setiap job punya daftar template.
# Saat assign misi, sistem pilih acak dari pool ini (weighted).
# type   = salah satu MissionType (BREAK_BLOCK, PLACE_BLOCK,
#          HARVEST_CROP, PLANT_CROP, CHOP_TREE, COLLECT_ITEM,
#          CRAFT_ITEM, SMELT_ITEM, FISH_ITEM, KILL_MOB, BREED_ANIMAL,
#          SHEAR_SHEEP, MILK_COW, COLLECT_EGG, MINE_ORE, MINE_STONE,
#          TRADE, ENCHANT, BREW_POTION, USE_MINION, DELIVER_ITEM,
#          EARN_MONEY, SELL_ITEM, UPGRADE_MINION, BUY_SHOP, SELL_SHOP,
#          NIGHT_MARKET_ACTION)
# target = material/entity spesifik (opsional, kosongkan buat misi
#          umum yang gak spesifik target)
# min-amount/max-amount = target acak di antara rentang ini
# money-per-unit/xp-per-unit = reward per unit target
# weight = bobot pemilihan acak (semakin besar semakin sering muncul)
# daily/weekly = boolean, misi ini boleh muncul di periode mana
# enabled = boolean, matikan template tanpa hapus
# ================================================================
mission-pools:
  miner:
    - { type: MINE_ORE, target: DIAMOND_ORE, min-amount: 5, max-amount: 15, money-per-unit: 8.0, xp-per-unit: 12.0, weight: 1.0, daily: true, weekly: true }
    - { type: MINE_ORE, target: IRON_ORE, min-amount: 20, max-amount: 60, money-per-unit: 2.0, xp-per-unit: 4.0, weight: 3.0, daily: true, weekly: true }
