# FILE: src/main/resources/inflation.yml
# ==========================================================
# EcoCore - Konfigurasi Mesin Inflasi
# ==========================================================

economy-baseline:
  initial-money-supply: 0.0
  target-inflation-percent: 2.0
  target-average-balance: 5000.0

thresholds:
  boom-growth-percent: 8.0
  recession-decline-percent: -5.0
  crisis-decline-percent: -15.0
  recovery-growth-percent: 3.0

weighting:
  total-money-weight: 0.25
  player-wealth-weight: 0.20
  average-balance-weight: 0.15
  trading-volume-weight: 0.20
  money-flow-weight: 0.10
  market-activity-weight: 0.10

# Revisi 16: efek gameplay per state ekonomi. price-multiplier
# dikalikan ke harga AI, job-bonus-multiplier dikalikan ke reward
# job/misi.
state-effects:
  boom:
    price-multiplier: 1.15
    job-bonus-multiplier: 0.9
  recession:
    price-multiplier: 0.9
    job-bonus-multiplier: 1.1
  economic-crisis:
    price-multiplier: 0.75
    job-bonus-multiplier: 1.3
  economic-growth:
    price-multiplier: 1.08
    job-bonus-multiplier: 0.95

history:
  snapshot-interval-seconds: 900
  keep-days: 90